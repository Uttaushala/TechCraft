buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
    }
}
apply plugin: "net.minecraftforge.gradle.forge"

version = "1.0.0"
group = "com.techcraft"
archivesBaseName = "techcraft-1.12.2"

sourceCompatibility = targetCompatibility = "1.8"
compileJava {
    sourceCompatibility = targetCompatibility = "1.8"
    options.encoding = "UTF-8"
}

minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

repositories {
    maven { url = "https://dvs1.progwml6.com/files/maven" }
    maven { url = "https://maven.ic2.player.to/" }
}

dependencies {
    // Compile-only: the real mods come with the modpack. JEI and IC2 integration is loaded only when they are present.
    deobfProvided "mezz.jei:jei_1.12.2:4.16.1.302:api"
    deobfProvided "net.industrial-craft:industrialcraft-2:2.8.222-ex112:api"
}

// Mekanism's gas API, compiled against but never shipped: it is fetched from the Mekanism sources (the tag that matches
// the version in the modpack) and left out of the jar, because the real Mekanism provides these classes at runtime.
def mekanismApiDir = file("$buildDir/mekanism-api")

task fetchMekanismApi {
    outputs.dir mekanismApiDir
    doLast {
        def zip = new File(buildDir, "mekanism-9.8.3.390.zip")
        zip.parentFile.mkdirs()
        if (!zip.exists()) {
            ant.get(src: "https://codeload.github.com/mekanism/Mekanism/zip/refs/tags/9.8.3.390", dest: zip)
        }
        delete mekanismApiDir
        copy {
            from zipTree(zip)
            include "Mekanism-9.8.3.390/src/main/java/mekanism/api/**"
            eachFile { it.path = it.path.replace("Mekanism-9.8.3.390/src/main/java/", "") }
            includeEmptyDirs = false
            into mekanismApiDir
        }
    }
}

sourceSets.main.java.srcDir mekanismApiDir
tasks.matching { it.name == "sourceMainJava" }.all { it.dependsOn fetchMekanismApi }

jar {
    exclude "mekanism/api/**"
    includeEmptyDirs = false
}
