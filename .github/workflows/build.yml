name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORGE: 1.12.2-14.23.5.2847

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Validate resources
        run: python3 tools/validate_assets.py

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: techcraft-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Starts a real Forge server with the mod and runs the in-game self-test (see SelfTest.java).
      - name: Smoke test on a dedicated server
        run: |
          mkdir servertest && cd servertest
          curl -sSfLO "https://maven.minecraftforge.net/net/minecraftforge/forge/$FORGE/forge-$FORGE-installer.jar"
          java -jar "forge-$FORGE-installer.jar" --installServer > installer.log 2>&1 || { tail -50 installer.log; exit 1; }
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-type=FLAT\ngenerate-structures=false\nspawn-monsters=false\nview-distance=4\n' > server.properties
          mkdir mods && cp $(ls ../build/libs/techcraft-*.jar | grep -v -- -sources) mods/
          set +e
          timeout 900 java -Xmx2G -Dtechcraft.selftest=true -jar "forge-$FORGE-universal.jar" nogui > server.log 2>&1
          set -e
          grep -E "SELFTEST|Exception|ERROR|FATAL" server.log | grep -v "Missing" | head -80 || true
          grep -q "SELFTEST RESULT: PASSED" server.log || { echo "Self-test did not pass; end of log:"; tail -120 server.log; exit 1; }

      # Same test again with IndustrialCraft 2 installed, to check the EU converters against its real energy net.
      - name: Smoke test with IC2 installed
        run: |
          cd servertest
          if curl -sfL -o ic2.jar "https://maven.ic2.player.to/net/industrial-craft/industrialcraft-2/2.8.222-ex112/industrialcraft-2-2.8.222-ex112.jar"; then
            cp ic2.jar mods/
            rm -rf world
            set +e
            timeout 900 java -Xmx2G -Dtechcraft.selftest=true -jar "forge-$FORGE-universal.jar" nogui > server-ic2.log 2>&1
            set -e
            grep -E "SELFTEST|ic2.*(ERROR|Exception)" server-ic2.log | head -60 || true
            grep -q "SELFTEST RESULT: PASSED" server-ic2.log || { echo "Self-test with IC2 did not pass; end of log:"; tail -150 server-ic2.log; exit 1; }
          else
            echo "IC2 could not be downloaded, skipping"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            servertest/server.log
            servertest/server-ic2.log
          if-no-files-found: ignore
