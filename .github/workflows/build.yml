name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORGE: 1.12.2-14.23.5.2847

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Validate resources
        run: python3 tools/validate_assets.py

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: techcraft-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Starts a real Forge server with the mod and runs the in-game self-test (see SelfTest.java).
      - name: Smoke test on a dedicated server
        run: |
          mkdir servertest && cd servertest
          curl -sSfLO "https://maven.minecraftforge.net/net/minecraftforge/forge/$FORGE/forge-$FORGE-installer.jar"
          java -jar "forge-$FORGE-installer.jar" --installServer > installer.log 2>&1 || { tail -50 installer.log; exit 1; }
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-type=FLAT\ngenerate-structures=false\nspawn-monsters=false\nview-distance=4\n' > server.properties
          mkdir mods && cp $(ls ../build/libs/techcraft-*.jar | grep -v -- -sources) mods/
          set +e
          timeout 900 java -Xmx2G -Dtechcraft.selftest=true -jar "forge-$FORGE-universal.jar" nogui > server.log 2>&1
          set -e
          grep -E "SELFTEST|Exception|ERROR|FATAL" server.log | grep -v "Missing" | head -80 || true
          grep -q "SELFTEST RESULT: PASSED" server.log || { echo "Self-test did not pass; end of log:"; tail -120 server.log; exit 1; }

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: servertest/server.log
          if-no-files-found: ignore
