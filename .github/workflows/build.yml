name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: techcraft-mod
          path: build/libs/*.jar
