name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Diagnostics
        continue-on-error: true
        run: |
          curl -s https://nexus.gtnewhorizons.com/repository/public/com/gtnewhorizons/retrofuturagradle/com.gtnewhorizons.retrofuturagradle.gradle.plugin/maven-metadata.xml | grep -oE '<(latest|release)>[^<]*' || true
          for u in \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2847/forge-1.12.2-14.23.5.2847-universal.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2847/forge-1.12.2-14.23.5.2847-userdev.jar \
            https://maven.cleanroommc.com/net/minecraftforge/forge/1.12.2-14.23.5.2847/forge-1.12.2-14.23.5.2847-userdev.jar ; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -L "$u") $u"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: techcraft-mod
          path: build/libs/*.jar
