name: Explore third-party APIs

# Temporary: finds the Mekanism 1.12.2 API on modmaven.dev so the gas integration can be written against it.
on:
  push:
    branches: [claude/minecraft-mod-mro3ht]
    paths: [.github/workflows/explore-apis.yml]
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Mekanism 1.12.2 on modmaven
        continue-on-error: true
        run: |
          curl -s https://modmaven.dev/mekanism/Mekanism/maven-metadata.xml | grep -o '<version>1\.12[^<]*' | tr '\n' ' '
          echo
          V=$(curl -s https://modmaven.dev/mekanism/Mekanism/maven-metadata.xml | grep -o '<version>1\.12\.2-9\.8[^<]*' | sed 's/<version>//' | tail -1)
          echo "chosen version: $V"
          curl -s "https://modmaven.dev/mekanism/Mekanism/$V/" | grep -oE 'href="[^"]*"'
          mkdir -p /tmp/api && cd /tmp/api
          for f in "Mekanism-$V-api.jar" "Mekanism-$V.jar"; do
            code=$(curl -s -o "$f" -w '%{http_code}' -L "https://modmaven.dev/mekanism/Mekanism/$V/$f")
            echo "$f -> $code ($(stat -c %s "$f" 2>/dev/null) bytes)"
          done
          J="Mekanism-$V-api.jar"
          [ -s "$J" ] && file "$J" | head -1
          unzip -l "$J" 2>/dev/null | grep -E "mekanism/api/gas/|Capabilit" | head -50
          for c in mekanism.api.gas.IGasHandler mekanism.api.gas.GasStack mekanism.api.gas.Gas mekanism.api.gas.GasTank mekanism.api.gas.GasRegistry mekanism.api.gas.GasTankInfo mekanism.api.gas.ITubeConnection; do
            javap -cp "$J" "$c" 2>&1 | head -45
          done
