name: Explore third-party APIs

# Temporary: prints the Mekanism 9.8.3.390 gas API sources so the integration can be written against them.
on:
  push:
    branches: [claude/minecraft-mod-mro3ht]
    paths: [.github/workflows/explore-apis.yml]
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the API sources
        run: |
          mkdir -p /tmp/mek && cd /tmp/mek
          curl -sfL -o mek.zip https://codeload.github.com/mekanism/Mekanism/zip/refs/tags/9.8.3.390
          unzip -q mek.zip "Mekanism-9.8.3.390/src/main/java/mekanism/api/*"
          cd Mekanism-9.8.3.390/src/main/java/mekanism/api
          echo "== api tree"; find . -maxdepth 1 | sort; ls gas
          for f in gas/Gas.java gas/GasStack.java gas/GasRegistry.java gas/GasTankInfo.java gas/GasTank.java gas/ITubeConnection.java; do
            echo "=== $f"; grep -vE '^\s*(\*|/\*|//)' "$f" | grep -vE '^\s*$' | head -90
          done
          echo "== imports used by gas package"; grep -h "^import mekanism" gas/*.java | sort -u
          echo "== capability and CapabilityInject"; grep -rn "CapabilityInject\|GAS_HANDLER" /tmp/mek --include=*.java | head
      - name: Where is the gas capability?
        run: |
          curl -s "https://raw.githubusercontent.com/mekanism/Mekanism/9.8.3.390/src/main/java/mekanism/common/capabilities/Capabilities.java" | grep -v '^\s*\*\|^\s*/\*\|^$' | head -40
          echo "== gas fuel values in Mekanism Generators"
          curl -s "https://raw.githubusercontent.com/mekanism/Mekanism/9.8.3.390/src/generators/java/mekanism/generators/common/FuelHandler.java" | head -80
