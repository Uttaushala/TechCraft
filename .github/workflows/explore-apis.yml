name: Explore third-party APIs

# Temporary: checks whether the Mekanism 1.12 API sources can be fetched from GitHub.
on:
  push:
    branches: [claude/minecraft-mod-mro3ht]
    paths: [.github/workflows/explore-apis.yml]
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Mekanism branches and API sources
        continue-on-error: true
        run: |
          curl -s "https://api.github.com/repos/mekanism/Mekanism/branches?per_page=100" | grep '"name"' | head -30
          curl -s "https://api.github.com/repos/mekanism/Mekanism/tags?per_page=100" | grep '"name"' | grep -E "1\.12|9\.8" | head -20
          for ref in 1.12.x 1.12 v1.12.2-9.8.3.390 1.12.2-9.8.3.390; do
            code=$(curl -s -o /tmp/IGasHandler.java -w '%{http_code}' "https://raw.githubusercontent.com/mekanism/Mekanism/$ref/src/main/java/mekanism/api/gas/IGasHandler.java")
            echo "$ref -> $code"
            [ "$code" = 200 ] && { cat /tmp/IGasHandler.java; break; }
          done
