name: Explore third-party APIs

# Temporary: finds the Mekanism 9.8.3.390 jar so the gas integration can be tested against the real mod.
on:
  push:
    branches: [claude/minecraft-mod-mro3ht]
    paths: [.github/workflows/explore-apis.yml]
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Release assets
        run: |
          for tag in 9.8.3.390 v9.8.3.390 1.12.2-9.8.3.390; do
            echo "== tag $tag"
            curl -s "https://api.github.com/repos/mekanism/Mekanism/releases/tags/$tag" | grep -E '"(name|browser_download_url|message)"' | head -12
          done
          echo "== direct downloads"
          for u in \
            https://github.com/mekanism/Mekanism/releases/download/9.8.3.390/Mekanism-1.12.2-9.8.3.390.jar \
            https://github.com/mekanism/Mekanism/releases/download/9.8.3.390/MekanismGenerators-1.12.2-9.8.3.390.jar \
            https://github.com/mekanism/Mekanism/releases/download/v9.8.3.390/Mekanism-1.12.2-9.8.3.390.jar; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -L "$u") $u"
          done
      - name: Other mirrors
        run: |
          for u in \
            https://www.curseforge.com/api/v1/mods/268560/files/2835174/download \
            https://edge.forgecdn.net/files/2835/174/Mekanism-1.12.2-9.8.3.390.jar \
            https://mediafilez.forgecdn.net/files/2835/174/Mekanism-1.12.2-9.8.3.390.jar \
            https://cdn.modrinth.com/data/Ud1nxSnC/versions/ ; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -L "$u") $u"
          done
          curl -s "https://api.modrinth.com/v2/search?query=mekanism&facets=%5B%5B%22versions:1.12.2%22%5D%5D" | head -c 600
