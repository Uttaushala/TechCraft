name: Explore third-party APIs

# Temporary: finds where the Mekanism API/jar can be downloaded from so the gas integration can be written against it.
on:
  push:
    branches: [claude/minecraft-mod-mro3ht]
    paths: [.github/workflows/explore-apis.yml]
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Probe Mekanism sources
        continue-on-error: true
        run: |
          probe() { echo "== $(curl -s -o /tmp/p.out -w '%{http_code}' -L "$1") $1"; head -c 600 /tmp/p.out | head -12; echo; }
          probe https://modmaven.dev/mekanism/Mekanism/maven-metadata.xml
          probe https://modmaven.dev/mekanism/
          probe https://modmaven.dev/
          probe https://maven.blamejared.com/mekanism/
          probe https://www.cursemaven.com/curse/maven/mekanism-268560/2835174/mekanism-268560-2835174.jar
          probe https://cursemaven.com/curse/maven/mekanism-268560/2835174/mekanism-268560-2835174.jar
          probe https://media.forgecdn.net/files/2835/174/Mekanism-1.12.2-9.8.3.390.jar
          probe https://github.com/mekanism/Mekanism/releases/download/1.12.2-9.8.3.390/Mekanism-1.12.2-9.8.3.390.jar
          probe https://api.github.com/repos/mekanism/Mekanism/releases?per_page=5
